<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sylva Systems | Aerial Intelligence Report</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="report-wrapper">
        <header class="main-header">
            <div class="brand">
                <img src="logo.png" alt="Sylva Systems" class="logo-img">
                <div class="brand-text">
                    <h1>SYLVA SYSTEMS</h1>
                    <p>AERIAL CROP INTELLIGENCE</p>
                </div>
            </div>
            <div class="header-right">
                <div class="health-gauge">
                    <div class="gauge-label">Overall Health</div>
                    <div class="gauge-score"><span id="mainScore">0</span><small>%</small></div>
                </div>
            </div>
        </header>

        <div class="meta-strip">
            <div class="meta-item"><span>FARM</span><strong id="farmName">Boyd Family Farm</strong></div>
            <div class="meta-item"><span>SCAN DATE</span><strong id="scanDate">April 19, 2026</strong></div>
            <div class="meta-item"><span>TOTAL TREES</span><strong id="kpiTotal">0</strong></div>
            <div class="meta-item"><span>STATUS</span><strong class="status-active">Active Analysis</strong></div>
        </div>

        <main class="content">
            <div class="action-bar">
                <label for="jsonUpload" class="btn-primary">Upload New Scan (.json)</label>
                <input type="file" id="jsonUpload" accept=".json" style="display:none">
                <div class="filter-group">
                    <button class="chip active" data-filter="all">All Trees</button>
                    <button class="chip" data-filter="stressed">Stressed</button>
                    <button class="chip" data-filter="healthy">Healthy</button>
                </div>
            </div>

            <section class="kpi-grid">
                <div class="kpi-card">
                    <span class="kpi-label">HEALTHY TREES</span>
                    <div class="kpi-val" id="kpiHealthy">0%</div>
                </div>
                <div class="kpi-card danger">
                    <span class="kpi-label">AT-RISK TREES</span>
                    <div class="kpi-val" id="kpiStressed">0%</div>
                </div>
                <div class="kpi-card">
                    <span class="kpi-label">AVG VARI</span>
                    <div class="kpi-val" id="kpiVari">0.000</div>
                </div>
                <div class="kpi-card">
                    <span class="kpi-label">AVG ExG</span>
                    <div class="kpi-val" id="kpiExg">0.0</div>
                </div>
            </section>

            <div class="data-grid">
                <div class="panel map-panel">
                    <div class="panel-header"><h3>Farm Health Map</h3></div>
                    <div class="map-viewport">
                        <div id="markers" class="marker-layer"></div>
                        <div class="map-overlay">ORTHO_REF_0426</div>
                    </div>
                </div>

                <div class="panel table-panel">
                    <div class="panel-header"><h3>Tree Inventory</h3></div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Status</th>
                                    <th>Primary Risk</th>
                                    <th>VARI</th>
                                </tr>
                            </thead>
                            <tbody id="treeRows"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="toast" class="toast" aria-hidden="true"></div>
    <script src="app.js"></script>
</body>
</html>
